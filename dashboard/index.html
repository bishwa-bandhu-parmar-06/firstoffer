    <title>FirstOffer · IT jobs for freshers</title>
    <script>
      // Apply a saved light/dark choice before the page paints, so it doesn't flash.
      try {
        var t = localStorage.getItem("firstoffer.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
